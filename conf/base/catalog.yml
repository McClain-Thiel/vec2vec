  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence
      - sequence_sha256
      - description
      - length_bp
      - leakage_component
      - split_grouped

# The audit only reads structured metadata, so it skips the sequence column —
# by far the widest in the table. Transcoded so Kedro still orders the writer
# before this reader.
retrieval_dataset@audit:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence_sha256
      - description
      - annotations
      - length_bp
      - split_grouped
      - backbone
      - vector_types
      - bacterial_resistance
      - insert_species
      - plasmid_copy
      - growth_strain
      - insert_genes
      - insert_mutations
      - insert_tags
      - insert_promoters

# E00 profile view: excludes the sequence and description columns, which are not
# used by the current semantics, split, or annotation-coverage measurements.
retrieval_dataset@semantics:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence_sha256
      - family_key
      - leakage_component
      - split_grouped
      - length_bp
      - vector_types
      - bacterial_resistance
      - insert_species
      - plasmid_copy
      - growth_strain
      - growth_temp
      - insert_genes
      - insert_mutations
      - insert_tags
      - insert_promoters

# Narrow view for the frozen manual audit. It carries the raw metadata and the
# two descriptions that a reviewer needs, but not the plasmid sequence.
retrieval_dataset@facet_audit:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence_sha256
      - addgene_id
      - url
      - description
      - source_description
      - leakage_component
      - split_grouped
      - plasmid_copy
      - growth_temp
      - bacterial_resistance
      - vector_types

# Train and validation metadata for deterministic constraint evidence. The
# catalog filter prevents this pipeline from loading test metadata.
retrieval_dataset@constraint_evidence:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    filters:
      - [split_grouped, in, [train, val]]
    columns:
      - sequence_id
      - sequence_sha256
      - addgene_id
      - url
      - source_description
      - leakage_component
      - split_grouped
      - plasmid_copy
      - growth_temp
      - bacterial_resistance
      - vector_types

# Full-population view for applying the already-frozen rule contract. Test
# metadata can receive a state, but it did not select mappings or conflict rules.
retrieval_dataset@constraint_state:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence_sha256
      - leakage_component
      - split_grouped
      - plasmid_copy
      - growth_temp
      - bacterial_resistance
      - vector_types

# Population identities for the frozen query benchmark. Constraint states and
# v2 split membership are loaded from their separately versioned products.
retrieval_dataset@query_benchmark:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence_sha256
      - family_key

# Full-sequence view for the explicit, local-compute E00 split audit. This is
# not part of the default pipeline because the global BLAST search is costly.
retrieval_dataset@split_audit:
  <<: *parquet
  filepath: ${globals:lake}/04_feature/retrieval_dataset.parquet
  versioned: true
  load_args:
    columns:
      - sequence_id
      - sequence
      - sequence_sha256
      - family_key
      - leakage_component
      - split_grouped
      - length_bp

