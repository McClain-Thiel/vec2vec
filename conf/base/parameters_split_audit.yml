# Fixed E00 split-audit protocol. Change these values only through a dated
# protocol amendment and write the result under a new audit version.
split_audit:
  audit_version: split_similarity_v0.1
  input_retrieval_version: 2026-08-04T09.02.10.007Z
  expected_input_population_sha256: 7e54ca3f9a3fe9f5e4afbffbdc458437665caf781e729ec33655f96381e446a5
  split_labels: [train, val, test]
  primary_rule:
    minimum_identity: 0.99
    minimum_query_coverage: 0.95
    minimum_subject_coverage: 0.95
    minimum_length_ratio: 0.95
  sensitivity_rule:
    minimum_identity: 0.95
    minimum_query_coverage: 0.90
    minimum_subject_coverage: 0.90
    minimum_length_ratio: 0.90
  search:
    executable: minimap2
    # asm20 is the minimap2 assembly preset intended for approximately 5%
    # divergence, which matches the sensitivity identity threshold.
    preset: asm20
    threads: 10
    # The repeated query makes a circular rotation continuous across the
    # original sequence endpoint. All coverage uses the undoubled length.
    query_repeat: 2
    # This deliberately yields a lower-bound edge table. Every query is still
    # searched globally, and any qualifying edge is a valid counterexample.
    secondary_alignment_limit: 10
    minimum_secondary_score_ratio: 0.5
