# Small agent-assisted review pilot. This job does not create accepted labels.
agent_judge_pilot:
  judge_version: e00-agent-judge-pilot-gpt56-luna-v0.1
  input_audit_version: e00-facet-audit-v0.1
  input_audit_output_version: 2026-08-04T14.39.25.320Z
  model: openai/gpt-5.6-luna
  provider: OpenAI
  max_tokens: 1000
  temperature: null
  seed: 17
  reasoning_enabled: false
  structured_output: true
  # Stop after the request that makes reported cumulative cost reach this value.
  # The final request can cause a small overshoot because cost is known after completion.
  cost_cap_usd: 0.10
  max_rows: 30
  stratum_counts:
    copy_class:missing: 4
    growth_temperature:held_out: 4
    bacterial_selection:proposed_exclude: 8
    bacterial_selection:proposed_include_combination: 5
    intended_use:proposed_exclude: 5
    intended_use:use_category: 4

# One fixed row per pilot stratum. Run this before the complete paid pilot.
agent_judge_smoke:
  judge_version: e00-agent-judge-smoke-gpt56-luna-v0.2
  input_audit_version: e00-facet-audit-v0.1
  input_audit_output_version: 2026-08-04T14.39.25.320Z
  input_packet_output_version: 2026-08-05T09.44.22.296Z
  model: openai/gpt-5.6-luna
  provider: OpenAI
  max_tokens: 1000
  temperature: null
  seed: 17
  reasoning_enabled: false
  structured_output: true
  cost_cap_usd: 0.25
  max_rows: 6
  pilot_indices: [1, 5, 9, 17, 22, 27]

# Independent validation of the exact 30 frozen pilot packets. It is not an
# accepted-label generator. Resolve disagreement against source evidence.
agent_judge_validator:
  judge_version: e00-agent-validator-gpt56-sol-v0.6
  input_audit_version: e00-facet-audit-v0.1
  input_audit_output_version: 2026-08-04T14.39.25.320Z
  input_packet_output_version: 2026-08-05T09.44.22.296Z
  model: openai/gpt-5.6-sol
  provider: OpenAI
  max_tokens: 3000
  temperature: null
  seed: 17
  reasoning_enabled: true
  reasoning_effort: high
  structured_output: true
  require_parameters: true
  request_timeout_seconds: 180
  # One scientific packet permits one request. Preserve a transport failure
  # instead of silently retrying a possibly charged request.
  max_retries: 0
  cost_cap_usd: 0.75
  max_rows: 30

# Targeted v0.2 rule check. Prepare packets first with agent_judge_targeted_packets,
# inspect them, and only then run the paid agent_judge_targeted pipeline.
