# Tunables for the data pipelines. Nothing here is a secret or a path:
# storage locations live in `globals.yml`, credentials in `conf/local`.

addgene:
  # Addgene fragment sequences are inserts and guides, not whole plasmids.
  # Including them would pair a whole-plasmid description with a fragment.
  include_partial: false
  # Rows per Parquet row group while streaming the raw JSON.
  chunk_size: 10000
  # Stop after this many records, for smoke runs. null processes the whole release.
  limit: null

annotations:
  # Cap on feature names kept per plasmid. null keeps them all; the prompt
  # separately shows only the first `MAX_FEATURES` of them.
  max_features: null

descriptions:
  model: moonshotai/kimi-k2
  # Pin an OpenRouter upstream provider (e.g. Groq) for throughput; null routes freely.
  provider: null
  max_tokens: 256
  temperature: 0.2
  concurrency: 8
  # One partition is written per batch, so an interrupted run loses at most this many.
  batch_size: 2000
  # Stop spending once the run has cost this much. null means no cap: set it.
  cost_cap_usd: 10.0
  # Cap on plasmids described in a single run, for pilots. null describes all pending.
  limit: null

import_descriptions:
  # Refuse an import generated by a different prompt than this project's.
  # null accepts whatever the published dataset carries.
  expect_prompt_version: desc-v2

description_qc:
  report_examples: 10

dataset:
  train_fraction: 0.8
  val_fraction: 0.1
  seed: 42

audit:
  split: train
  max_order: 3
  seed: 17
  examples_per_order: 20

# E00 profiles these fields without yet deciding their biological semantics.
constraint_semantics:
  fields:
    - vector_types
    - bacterial_resistance
    - insert_species
    - plasmid_copy
    - growth_strain
    - growth_temp
    - insert_genes
    - insert_mutations
    - insert_tags
    - insert_promoters
  split_labels: [train, val, test]
  support:
    minimum_rows: 10
    minimum_components: 2
  plannotate:
    expected_source: plannotate
    # The current normalized artifact does not contain these provenance values.
    # Keep them null so the profile reports the gap instead of inventing values.
    software_version: null
    database_version: null
    circular_setting: null
    coordinate_convention: source_qstart_qend_preserved_uninterpreted

openrouter:
  api_key: ${oc.env:OPENROUTER_API_KEY,null}
