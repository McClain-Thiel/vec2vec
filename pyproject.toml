[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11,<3.14"
name = "vec2vec"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "kedro~=1.5.0",
    "kedro-datasets[pandas-csvdataset,pandas-parquetdataset,json]>=8",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "s3fs>=2024.6",
    "fsspec>=2024.6",
    # Provides the hf:// filesystem used to import already-published descriptions.
    "huggingface-hub>=0.34",
    "ijson>=3.3",
    "httpx>=0.27",
]

[project.scripts]
vec2vec = "vec2vec.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
viz = [
    "kedro-viz>=9",
]
notebook = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
]
dev = [
    "pytest~=8.0",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "ruff~=0.12.0",
]

[tool.setuptools.dynamic.version]
attr = "vec2vec.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "vec2vec"
project_name = "vec2vec"
kedro_init_version = "1.5.0"
tools = "['Testing', 'Custom Logging', 'Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.kedro_telemetry]
project_id = "d9cd00bd480244a7be84facff3feea0f"
